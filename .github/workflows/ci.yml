name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Real Chromium browser integration smoke
        if: matrix.node-version == 22
        run: npm run check:browser:runtime
      - run: npm run benchmark:smoke
      - name: Observe browser worker performance and frame responsiveness
        if: matrix.node-version == 22
        run: npm run benchmark:browser
      - name: Record synthetic benchmarks (not a performance gate)
        if: matrix.node-version == 22
        run: npm run benchmark -- --iterations=3 --json
      - run: npm pack --dry-run
      - name: Verify installed tarball and public API entrypoints
        if: matrix.node-version == 22
        run: npm run check:package
      - name: Probe public npm registry package status (read-only)
        if: matrix.node-version == 22
        run: node scripts/check-registry.mjs
