name: Release compiled Raster Core

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Select new version on current main only
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; skip obsolete release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .pfx/release.mjs --sync
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Unexpected alpha version: $version" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $version is already distributed."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Resolve deterministic core version
        run: node .pfx/release.mjs --sync
      - name: Install and verify full core
        if: steps.gate.outputs.publish == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run check:package
          npm run check:browser:runtime
      - name: Package independently installable compiled archive
        if: steps.gate.outputs.publish == 'true'
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --ignore-scripts --json --pack-destination release-artifacts > release-pack.json
          filename="$(node -e "const d=require('./release-pack.json'); if(d.length!==1)process.exit(1); process.stdout.write(d[0].filename)")"
          expected="pfxamd-raster-core-${{ steps.gate.outputs.version }}.tgz"
          test "$filename" = "$expected"
          ( cd release-artifacts && sha256sum "$filename" > "$filename.sha256" )
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release (no registry credentials)
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          ARCHIVE: ${{ steps.pack.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$current" = "$SOURCE_SHA"
          gh release create "$TAG" \
            "release-artifacts/$ARCHIVE" "release-artifacts/$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --prerelease \
            --generate-notes
      - name: Record current core version and badge
        if: github.event.workflow_run.event == 'push' && steps.gate.outputs.publish == 'true'
        run: node .pfx/release.mjs --publish

